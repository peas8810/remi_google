<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;--border:#e5e7eb;--text:#0f172a;--muted:#64748b;--muted2:#94a3b8;
      --accent:#1f77b4;--badgeBg:#f1f5f9;--shadow:0 1px 0 rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06)
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:transparent;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .card{background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 10px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
    .brand{display:flex;align-items:center;gap:8px;min-width:0}
    .icon{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(31,119,180,.14),rgba(31,119,180,.04));border:1px solid rgba(31,119,180,.18);flex:0 0 auto}
    .titleWrap{min-width:0}.title{font-size:13px;font-weight:800;color:var(--text);line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .subtitle{margin-top:2px;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .badge{font-size:10px;font-weight:700;color:var(--muted);background:var(--badgeBg);border:1px solid var(--border);padding:4px 8px;border-radius:999px;white-space:nowrap}
    .stats{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}.stat{flex:1 1 120px;border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:linear-gradient(180deg,#fff,#fafafa)}
    .k{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;margin-bottom:3px}.v{font-size:16px;font-weight:800;color:var(--text);line-height:1}
    .sparkBox{border:1px solid var(--border);border-radius:12px;padding:8px 10px 6px;background:#fff}.sparkHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
    .sparkLabel{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sparkMini{font-size:10px;font-weight:700;color:var(--muted2);white-space:nowrap}
    .canvasWrap{position:relative;width:100%;height:58px}.canvasWrap canvas{display:block;width:100%!important;height:58px!important}
    .foot{margin-top:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted2)}
    a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">
      <div class="icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M4 19V5" stroke="rgba(31,119,180,.75)" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 19H20" stroke="rgba(31,119,180,.55)" stroke-width="2" stroke-linecap="round"/>
          <path d="M6.5 15.5L10 12l3 2.2 5-6.2" stroke="rgba(31,119,180,.95)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="titleWrap"><p class="title">Metrics Dashboard</p><div class="subtitle">Scilit • REMI</div></div>
    </div>
    <div class="badge">MDPI-style</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">h5-index</div><div class="v" id="h5">—</div></div>
    <div class="stat"><div class="k">MCM</div><div class="v" id="mcm">—</div></div>
  </div>

  <div class="sparkBox">
    <div class="sparkHead"><div class="sparkLabel">Monthly Citation Metric</div><div class="sparkMini" id="lastPoint">—</div></div>
    <div class="canvasWrap"><canvas id="spark"></canvas></div>
  </div>

  <div class="foot">
    <div>Atualização: <span id="updated">—</span></div>
    <div><a href="https://www.scilit.com/sources/019f25e40c1872ae9ebc9488e577dd65" target="_blank" rel="noopener">Scilit - Click here</a></div>
  </div>
</div>

<script>
(async function(){
  const FALLBACK_DATA = {
    source:"https://www.scilit.com/sources/019f25e40c1872ae9ebc9488e577dd65",
    updated_at:"2026-08-26",
    h5_index:2,
    mcm:0.12,
    series:[
      {month:"2025-02",value:0.11},{month:"2025-03",value:0.12},{month:"2025-04",value:0.13},{month:"2025-05",value:0.14},
      {month:"2025-06",value:0.20},{month:"2025-07",value:0.16},{month:"2025-08",value:0.17},{month:"2025-09",value:0.18},
      {month:"2025-10",value:0.18},{month:"2025-11",value:0.18},{month:"2025-12",value:0.19},{month:"2026-01",value:0.16},
      {month:"2026-02",value:0.15},{month:"2026-03",value:0.14},{month:"2026-04",value:0.13},{month:"2026-05",value:0.10},
      {month:"2026-06",value:0.10},{month:"2026-07",value:0.11},{month:"2026-08",value:0.12}
    ]
  };

  const DATA_URL = "./remi-scilit.json";
  const h5El=document.getElementById("h5"), mcmEl=document.getElementById("mcm"), updEl=document.getElementById("updated"), lastEl=document.getElementById("lastPoint");
  const fmt=n=>{if(n===null||n===undefined||n==="")return"—";const x=Number(n);if(Number.isNaN(x))return String(n);return(Math.abs(x)<1&&x!==0)?x.toFixed(2):(Number.isInteger(x)?String(x):x.toFixed(2))};

  let data=FALLBACK_DATA;
  try{
    const res=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(res.ok){const remote=await res.json();if(remote&&Array.isArray(remote.series)&&remote.series.length)data=remote;}
  }catch(e){console.log("Usando dados de fallback:",e)}

  h5El.textContent=fmt(data.h5_index);mcmEl.textContent=fmt(data.mcm);updEl.textContent=data.updated_at||"—";
  const series=Array.isArray(data.series)?data.series:[];
  const labels=series.map(p=>p.month), values=series.map(p=>Number(p.value)).filter(Number.isFinite);
  if(!values.length){lastEl.textContent="Dados indisponíveis";return}
  const lastIdx=values.length-1,lastMonth=labels[lastIdx]||"",lastVal=values[lastIdx];lastEl.textContent=lastMonth?`${lastMonth} • ${fmt(lastVal)}`:fmt(lastVal);
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#1f77b4';
  const min=Math.min(...values),max=Math.max(...values),pad=(max-min)*.15||.05;

  if(window.Chart){
    new Chart(document.getElementById("spark"),{
      type:"line",
      data:{labels,datasets:[{data:values,borderColor:accent,borderWidth:2,tension:.35,fill:false,pointRadius:ctx=>ctx.dataIndex===lastIdx?3.6:0,pointHoverRadius:5,pointBackgroundColor:accent,pointBorderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{title:items=>items?.[0]?.label||"",label:item=>"MCM: "+fmt(item.raw)}}},scales:{x:{display:false,grid:{display:false}},y:{display:false,min:min-pad,max:max+pad,grid:{display:false}}}}
    });
    return;
  }

  const canvas=document.getElementById("spark"),ctx=canvas.getContext("2d");
  function drawNative(){
    const rect=canvas.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(58*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,58);
    const w=rect.width,h=58,p=5,range=(max+pad)-(min-pad)||1;
    const pts=values.map((v,i)=>({x:p+(w-p*2)*(i/(Math.max(1,values.length-1))),y:p+(h-p*2)*(1-((v-(min-pad))/range))}));
    ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();pts.forEach((pt,i)=>i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));ctx.stroke();
    const lp=pts[pts.length-1];ctx.fillStyle=accent;ctx.beginPath();ctx.arc(lp.x,lp.y,3.6,0,Math.PI*2);ctx.fill();
  }
  drawNative();window.addEventListener("resize",drawNative);
})();
</script>
</body>
</html>
