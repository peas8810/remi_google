name: Update Scilit REMI JSON

on:

  schedule:

    # Todo dia 1 de cada mês
    # às 03:30 UTC.
    #
    # Usei horário diferente da REMUNOM,
    # que atualmente executa às 03:15 UTC.

    - cron: "30 3 1 * *"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install requests


      - name: Update REMI Scilit metrics
        run: |

          python scripts/update_scilit_remi.py


      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "github-actions[bot]@users.noreply.github.com"

          git add remi-scilit.json

          git diff --cached --quiet || \
          git commit -m "auto: update REMI Scilit metrics"

          git push
